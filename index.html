<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Sword War</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        canvas {
            background: #1e293b;
            border: 4px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: crosshair;
            max-width: 100%;
        }
        .ui-container {
            margin-top: 10px;
        }
        button, input {
            padding: 10px 15px;
            margin: 5px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }
        button {
            background: #f43f5e;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #e11d48; }
        input { background: #334155; color: white; }
    </style>
</head>
<body>

    <h2>⚔️ Titan Sword War: Battle Arena</h2>

    <!-- Login Sederhana untuk Supabase -->
    <div id="login-screen">
        <input type="text" id="username" placeholder="Nama Kesatria...">
        <button onclick="startGameSession()">Masuk Arena</button>
    </div>

    <!-- Area Game -->
    <div id="game-screen" style="display: none;">
        <div>Stage: <span id="stage-display">1</span> | Skor: <span id="score-display">0</span></div>
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        <div class="ui-container">
            <p><i>Klik pada canvas untuk melemparkan pedang ke musuh!</i></p>
            <button onclick="saveProgress()" style="background: #10b981;">Simpan ke Supabase</button>
        </div>
    </div>

    <script>
        // Konfigurasi Supabase
        const SUPABASE_URL = 'https://mlsibwihfzehqcdawrdh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sc2lid2loZnplaHFjZGF3cmRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTcwNTEsImV4cCI6MjEwMzY5MzA1MX0.faKWNZqTLE6nEH6nPw0L4uFepTy6ZvqrZDy2BaHcWxs';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let playerName = '';
        let score = 0;
        let stage = 1;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Posisi target musuh & pedang pemain
        let enemy = { x: 200, y: 100, radius: 30, speed: 2 };
        let swords = [];
        let playerThrowing = false;

        function startGameSession() {
            const inputVal = document.getElementById('username').value.trim();
            if (!inputVal) {
                alert('Masukkan nama kesatria dulu!');
                return;
            }
            playerName = inputVal;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            // Muat data dari Supabase jika ada
            fetchPlayerScore();
            loop();
        }

        async function fetchPlayerScore() {
            let { data } = await _supabase
                .from('sword_war_saves')
                .select('*')
                .eq('username', playerName)
                .single();

            if (data) {
                score = data.score;
                stage = data.stage;
            } else {
                await _supabase.from('sword_war_saves').insert([{ username: playerName, score: 0, stage: 1 }]);
            }
        }

        // Kontrol klik untuk melempar pedang
        canvas.addEventListener('click', (e) => {
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            // Tambahkan pedang meluncur ke arah klik/musuh
            swords.push({ x: 200, y: 450, targetX: mouseX, targetY: mouseY, active: true });
        });

        function update() {
            // Gerakkan musuh mondar-mandir
            enemy.x += enemy.speed;
            if (enemy.x > 350 || enemy.x < 50) {
                enemy.speed *= -1;
            }

            // Update posisi pedang yang dilempar
            swords.forEach((sword, index) => {
                sword.y -= 10; // Gerak ke atas
                // Deteksi kena musuh sederhana
                let dist = Math.hypot(sword.x - enemy.x, sword.y - enemy.y);
                if (dist < enemy.radius + 10) {
                    score += 10;
                    stage = Math.floor(score / 50) + 1;
                    swords.splice(index, 1);
                    // Reset posisi musuh & percepat sedikit
                    enemy.x = Math.random() * 300 + 50;
                    enemy.speed = (enemy.speed > 0 ? 1 : -1) * (2 + stage * 0.5);
                } else if (sword.y < 0) {
                    swords.splice(index, 1);
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gambar Musuh (Titan/Monster)
            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.closePath();
            ctx.fillStyle = 'white';
            ctx.font = '12px sans-serif';
            ctx.fillText('Titan', enemy.x - 15, enemy.y - 35);

            // Gambar Pedang-pedang yang dilempar
            swords.forEach(sword => {
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(sword.x - 3, sword.y, 6, 20);
            });

            // Gambar Karakter Pemain di bawah
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(180, 460, 40, 30);
            ctx.fillStyle = 'white';
            ctx.fillText('Kesatria', 178, 450);

            // Update Teks UI
            document.getElementById('score-display').innerText = score;
            document.getElementById('stage-display').innerText = stage;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        async function saveProgress() {
            const { error } = await _supabase
                .from('sword_war_saves')
                .update({ score: score, stage: stage })
                .eq('username', playerName);

            if (error) {
                alert('Gagal simpan: ' + error.message);
            } else {
                alert('⚔️ Progress perang pedang tersimpan ke Supabase!');
            }
        }
    </script>
</body>
</html>
